services:
  - type: web
    name: mescript-render-ai-proxy
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    repo: .
    branch: main
    path: apps/backend/render-backend
    envVars:
      - key: HUGGINGFACE_API_KEY
        scope: private
      - key: HUGGINGFACE_MODEL
        value: gpt2
